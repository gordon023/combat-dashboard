<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="flex flex-col items-center justify-center h-screen bg-gray-900 text-white">
  <h1 class="text-2xl mb-4">Combat Dashboard Login</h1>
  <form id="loginForm" class="flex flex-col gap-3 w-64">
    <input type="text" id="username" placeholder="Username" class="p-2 rounded text-black" required />
    <input type="password" id="password" placeholder="Password (leave blank for guest)" class="p-2 rounded text-black" />
    <button type="submit" class="bg-blue-600 hover:bg-blue-500 rounded p-2">Login</button>
  </form>

  <script src="login.js"></script>
</body>
</html>
