<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Combat Dashboard</h1>
    <span id="userDisplay"></span>
    <button id="logout">Logout</button>
  </header>

  <nav>
    <button class="tabBtn" data-tab="dashboard">Dashboard</button>
    <button class="tabBtn" data-tab="wallet">Wallet</button>
    <button class="tabBtn" data-tab="combat">Combat</button>
    <button class="tabBtn adminOnly" data-tab="requests">Requests</button>
  </nav>

  <main>
    <section id="dashboard" class="tabSection"></section>
    <section id="wallet" class="tabSection hidden"></section>
    <section id="combat" class="tabSection hidden"></section>
    <section id="requests" class="tabSection hidden"></section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
