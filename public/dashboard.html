<body class="bg-gray-900 text-gray-200 font-sans">
  <header class="flex justify-between items-center p-4 bg-gray-800 shadow">
    <h1 class="text-xl font-semibold">Dashboard</h1>
    <div>
      <span id="displayUser" class="mr-4"></span>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Logout</button>
    </div>
  </header>

  <main class="p-4 space-y-6">
    <!-- Tabs -->
    <div class="flex space-x-4">
      <button class="tabBtn active-tab" data-tab="dashboardTab">📢 Dashboard</button>
      <button class="tabBtn" data-tab="walletTab">💰 Wallet</button>
      <button class="tabBtn" data-tab="combatTab">⚔️ Combat</button>
      <button class="tabBtn adminOnly hidden" data-tab="requestsTab">📨 Requests</button>
    </div>

    <!-- Dashboard Tab -->
    <section id="dashboardTab" class="tabSection">
      <h2 class="text-lg mb-2">Announcements</h2>
      <div id="announcementList" class="space-y-2"></div>

      <div id="adminAnnouncement" class="adminOnly hidden mt-4">
        <textarea id="announceInput" placeholder="Write announcement..." class="w-full p-2 bg-gray-800 rounded"></textarea>
        <button id="postAnnouncement" class="bg-blue-600 mt-2 px-3 py-1 rounded">Post Announcement</button>
      </div>
    </section>

    <!-- Wallet Tab -->
    <section id="walletTab" class="tabSection hidden">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg">Wallet Records</h2>
        <button id="addWalletBtn" class="bg-green-600 px-3 py-1 rounded">➕ Add Wallet</button>
      </div>

      <div id="walletForm" class="hidden mb-4">
        <input id="walletInput" placeholder="Enter wallet details..." class="w-full p-2 bg-gray-800 rounded mb-2">
        <button id="saveWalletBtn" class="bg-blue-600 px-3 py-1 rounded">Save</button>
      </div>

      <table class="w-full text-left border-collapse border border-gray-700">
        <thead>
          <tr class="bg-gray-800">
            <th class="p-2 border border-gray-700">Name</th>
            <th class="p-2 border border-gray-700">Wallet Info</th>
            <th class="p-2 border border-gray-700">Date</th>
            <th class="p-2 border border-gray-700">Actions</th>
          </tr>
        </thead>
        <tbody id="walletList"></tbody>
      </table>
    </section>

    <!-- Combat Tab -->
    <section id="combatTab" class="tabSection hidden">
      <h2 class="text-lg mb-2">Combat Power Detection</h2>
      <input type="file" id="combatImage" class="mb-2">
      <button id="uploadCombat" class="bg-blue-600 px-3 py-1 rounded">Upload</button>
      <div id="combatPreview" class="mt-4"></div>

      <table class="w-full text-left border-collapse border border-gray-700 mt-4">
        <thead>
          <tr class="bg-gray-800">
            <th class="p-2 border border-gray-700">Name</th>
            <th class="p-2 border border-gray-700">Combat Power</th>
            <th class="p-2 border border-gray-700">Date</th>
            <th class="p-2 border border-gray-700">Image</th>
            <th class="p-2 border border-gray-700">Actions</th>
          </tr>
        </thead>
        <tbody id="combatList"></tbody>
      </table>
    </section>

    <!-- Requests Tab (Admin only) -->
    <section id="requestsTab" class="tabSection hidden">
      <h2 class="text-lg mb-2">Edit Requests from Guests</h2>
      <div id="requestList" class="space-y-2"></div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
