<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Combat Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="dashboard" class="container">
    <h2>⚔️ Combat Dashboard</h2>

    <section id="announcements">
      <h3>📢 Announcements</h3>
      <div id="announcementList"></div>
      <div id="announcementForm" class="admin-only">
        <input type="text" id="announcementText" placeholder="Write an announcement...">
        <button onclick="postAnnouncement()">Post</button>
      </div>
    </section>

    <section id="wallets">
      <h3>💰 Wallets</h3>
      <div id="walletList"></div>
      <div id="walletForm">
        <input type="text" id="walletName" placeholder="Name">
        <input type="text" id="walletAddress" placeholder="Wallet Address">
        <button onclick="addWallet()">Add</button>
      </div>
    </section>

    <section id="combats">
      <h3>⚔️ Combat Power Detection</h3>
      <div id="combatList"></div>
      <form id="combatForm" enctype="multipart/form-data">
        <input type="file" id="combatImage" name="image" accept="image/*">
        <button type="submit">Upload & Detect</button>
      </form>
    </section>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
