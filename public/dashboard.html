<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Combat Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="flex justify-between items-center p-4 bg-gray-800">
    <h1 class="text-xl">Combat Dashboard</h1>
    <div>
      <span id="userInfo"></span>
      <button id="logoutBtn" class="ml-3 bg-red-600 px-3 py-1 rounded">Logout</button>
    </div>
  </header>

  <main class="p-4">
    <nav class="flex gap-4 mb-4">
      <button class="tabBtn" data-tab="announcement">Announcement</button>
      <button class="tabBtn" data-tab="wallet">Wallet</button>
      <button class="tabBtn" data-tab="combat">Combat</button>
      <button class="tabBtn adminOnly" data-tab="requests">Requests</button>
    </nav>

    <!-- Announcement Section -->
    <section id="announcement" class="tab">
      <h2 class="text-lg mb-2">Announcements</h2>
      <div id="announcementList" class="mb-4"></div>

      <div id="announceAdmin" class="adminOnly">
        <textarea id="announceText" placeholder="Write announcement..." class="text-black p-2 w-full rounded"></textarea>
        <button id="postAnnouncement" class="bg-blue-600 px-3 py-1 mt-2 rounded">Post</button>
      </div>
    </section>

    <!-- Wallet Section -->
    <section id="wallet" class="tab hidden">
      <h2 class="text-lg mb-2">Wallet</h2>
      <input id="walletFilter" placeholder="Filter by name..." class="text-black p-1 rounded mb-2" />
      <div id="walletList"></div>

      <div class="mt-4">
        <input id="walletAmount" type="text" placeholder="Amount" class="text-black p-1 rounded" />
        <button id="addWallet" class="bg-green-600 px-3 py-1 rounded">Add Wallet</button>
      </div>
    </section>

    <!-- Combat Section -->
  <section id="combat" class="tab hidden">
  <h2 class="text-lg mb-2">Combat Power Detection</h2>

  <input type="file" id="combatImage" class="mb-2" />
  <button id="uploadCombat" class="bg-blue-600 px-3 py-1 rounded">Upload</button>

  <div id="combatPreview" class="mt-4"></div>
  <hr class="my-4 border-gray-600">

  <h3 class="text-lg mb-2">Recorded Combat Powers</h3>
  <div id="combatList"></div>
</section>


    <!-- Requests Section -->
    <section id="requests" class="tab hidden adminOnly">
      <h2 class="text-lg mb-2">Edit Requests from Guests</h2>
      <div id="requestList"></div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
