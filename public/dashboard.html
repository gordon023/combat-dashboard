<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="flex justify-between items-center p-4 bg-gray-800">
    <h1 class="text-xl">Combat Dashboard</h1>
    <div>
      <span id="userInfo"></span>
      <button id="logoutBtn" class="ml-3 bg-red-600 px-3 py-1 rounded">Logout</button>
    </div>
  </header>

  <main class="p-4">
    <nav class="flex gap-4 mb-4">
      <button class="tabBtn" data-tab="announcement">Announcement</button>
      <button class="tabBtn" data-tab="wallet">Wallet</button>
      <button class="tabBtn" data-tab="combat">Combat</button>
      <button class="tabBtn adminOnly" data-tab="requests">Requests</button>
    </nav>

    <section id="announcement" class="tab">Announcement content here</section>
    <section id="wallet" class="tab hidden">Wallet content here</section>
    <section id="combat" class="tab hidden">Combat upload area here</section>
    <section id="requests" class="tab hidden adminOnly">Requests list here</section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
